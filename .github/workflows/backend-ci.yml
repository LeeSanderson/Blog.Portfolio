name: Backend CI

on:
  push:
    paths:
      - "apps/*/backend/**"
      - "shared/backend/**"
      - "host/**"
      - "aspire/**"
      - "Blog.Portfolio.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The Aspire integration test (ticket 04) starts a real Functions host via Azure Functions Core
      # Tools, which GitHub-hosted runners don't preinstall.
      # Installed from the GitHub release rather than npm: the runner's npm sends an auth token that the
      # public registry rejects with E401, and it survives bypassing the user config, the global config
      # and the registry setting, so the token comes from a config level a workflow can't reach. The
      # version matches npm's `latest` dist-tag, and the release's own .sha2 is checked because this
      # pulls a binary into CI over the network.
      - name: Install Azure Functions Core Tools
        env:
          CORE_TOOLS_VERSION: "4.14.0"
        run: |
          base="https://github.com/Azure/azure-functions-core-tools/releases/download/${CORE_TOOLS_VERSION}"
          asset="Azure.Functions.Cli.linux-x64.${CORE_TOOLS_VERSION}.zip"
          curl -sSfL -o /tmp/func.zip "${base}/${asset}"
          curl -sSfL -o /tmp/func.sha2 "${base}/${asset}.sha2"
          echo "$(awk '{print $1}' /tmp/func.sha2)  /tmp/func.zip" | sha256sum -c -
          unzip -q /tmp/func.zip -d "$HOME/func"
          chmod +x "$HOME/func/func"
          if [ -f "$HOME/func/gozip" ]; then chmod +x "$HOME/func/gozip"; fi
          echo "$HOME/func" >> "$GITHUB_PATH"
          "$HOME/func/func" --version

      - name: Restore
        run: dotnet restore Blog.Portfolio.slnx

      - name: Build
        run: dotnet build Blog.Portfolio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Blog.Portfolio.slnx --configuration Release --no-build

      - name: Publish host
        run: dotnet publish host/src/Blog.Portfolio.Host/Blog.Portfolio.Host.csproj --configuration Release --output ./publish/host

      # azd deploy --from-package requires a zip file path, not a directory - zip it here so CD
      # can deploy this exact artifact without rebuilding.
      - name: Package host as zip
        run: (cd ./publish/host && zip -r ../../host.zip .)

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-publish
          path: ./host.zip
          retention-days: 14
