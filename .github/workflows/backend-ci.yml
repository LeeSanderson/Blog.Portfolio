name: Backend CI

on:
  push:
    paths:
      - "apps/*/backend/**"
      - "shared/backend/**"
      - "host/**"
      - "aspire/**"
      - "Blog.Portfolio.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Temp: Install version 4.12.1 as the latest version 4.14.0 has a bug that prevents installation 
      # and 4.13.2 has a bug that prevents running the function host on Linux.
      # See: https://github.com/Azure/azure-functions-core-tools/issues/5569
      # And: https://github.com/Azure/azure-functions-core-tools/issues/5538
      - name: Install Azure Functions Core Tools
        run: npm i --verbose -g azure-functions-core-tools@4.12.1 --unsafe-perm true

      - name: Restore
        run: dotnet restore Blog.Portfolio.slnx

      - name: Build
        run: dotnet build Blog.Portfolio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Blog.Portfolio.slnx --configuration Release --no-build

      - name: Publish host
        run: dotnet publish host/src/Blog.Portfolio.Host/Blog.Portfolio.Host.csproj --configuration Release --output ./publish/host

      # azd deploy --from-package requires a zip file path, not a directory - zip it here so CD
      # can deploy this exact artifact without rebuilding.
      - name: Package host as zip
        run: (cd ./publish/host && zip -r ../../host.zip .)

      - name: Upload host artifact
        uses: actions/upload-artifact@v7
        with:
          name: host-publish
          path: ./host.zip
          retention-days: 14
