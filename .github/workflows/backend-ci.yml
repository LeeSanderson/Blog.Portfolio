name: Backend CI

on:
  push:
    paths:
      - "apps/*/backend/**"
      - "shared/backend/**"
      - "host/**"
      - "aspire/**"
      - "Blog.Portfolio.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The Aspire integration test (ticket 04) starts a real Functions host via Azure Functions Core
      # Tools, which GitHub-hosted runners don't preinstall.
      # The runner carries an npm auth token that the public registry rejects with E401, and there is no
      # user npmrc holding it, so both config files are pointed at absent paths to install this public
      # package anonymously. The two paths must differ: npm aborts before resolving config if the same
      # file is loaded as both user and global. The probes report where config came from without printing
      # any npmrc contents or env values, either of which could leak the token into a public log.
      - name: Install Azure Functions Core Tools
        env:
          NPM_CONFIG_USERCONFIG: /tmp/npmrc-absent-user
          NPM_CONFIG_GLOBALCONFIG: /tmp/npmrc-absent-global
        run: |
          echo "registry:     $(npm config get registry)"
          echo "globalconfig: $(npm config get globalconfig)"
          echo "npm/node auth env vars present: $(env | grep -cE '^(npm_config_|NPM_|NODE_AUTH)' || true)"
          npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Restore
        run: dotnet restore Blog.Portfolio.slnx

      - name: Build
        run: dotnet build Blog.Portfolio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Blog.Portfolio.slnx --configuration Release --no-build

      - name: Publish host
        run: dotnet publish host/src/Blog.Portfolio.Host/Blog.Portfolio.Host.csproj --configuration Release --output ./publish/host

      # azd deploy --from-package requires a zip file path, not a directory - zip it here so CD
      # can deploy this exact artifact without rebuilding.
      - name: Package host as zip
        run: (cd ./publish/host && zip -r ../../host.zip .)

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-publish
          path: ./host.zip
          retention-days: 14
